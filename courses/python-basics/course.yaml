name: "Python Basics"
slug: python-basics
description: >
  A friendly, hands-on introduction to Python for people who have never
  written a line of code. Ten short video lessons take you from "what even
  is Python?" to writing your own small programs.

style:
  voice: af_heart
  tone: warm, encouraging teacher who explains with everyday analogies
  pace_wpm: 145
  audience: absolute beginners with no programming experience
  language: en

branding:
  colors:
    primary: "#306998"    # Python blue
    accent: "#ffd43b"     # Python yellow
    background: "#ffffff"
  diagram_style: clean, flat, rounded corners, generous whitespace

pipeline:
  # OpenAI for content too: Groq's free-tier 12k tokens/min window stalls on
  # large regeneration prompts and there is no such squeeze here. gpt-5-mini
  # rather than the gpt-4o-mini this used to name — same order of cost per
  # lesson, and it can actually honour the constraints the prompts set out.
  llm_content: openai/gpt-5-mini
  llm_review: openai/gpt-5-mini
  review_threshold: 8
  captions_model: whisper-large-v3
  # Just the videos — no quiz/mistakes/exercises/site generation.
  video_only: true
