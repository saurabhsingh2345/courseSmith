name: learning-science

# Workstream I gate: the cognitive-science invariants the quiz-strategy stage
# (G) must uphold — interleaving minimizes adjacent same-type items and the
# difficulty split is sane. These are pure Go unit tests (fast, deterministic,
# no LLM/network) plus a JSON check over a committed generated fixture.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  learning-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: quiz-strategy unit tests
        run: go test ./internal/pipeline -run 'Interleav|Difficulty|QuizStrategy|QuizValidation' -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: validate committed quiz_sequence fixture
        run: node test/learning_science.mjs courses/python-basics/lessons/01-what-is-python/generated
