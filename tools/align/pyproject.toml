[project]
name = "coursesmith-align"
version = "0.1.0"
description = "Word-level audio alignment for coursesmith (whisperX, CPU int8)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "whisperx==3.4.3",
    "torch==2.7.1",
    "torchaudio==2.7.1",
]

[tool.uv]
# CPU-only torch keeps the install small; alignment runs int8 on CPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
